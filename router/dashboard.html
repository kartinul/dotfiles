<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini router</title>
  <style>
    :root {
      --bg: #e7ecf0;
      --surface: #f7f9fa;
      --ink: #0f1f2c;
      --muted: #56666f;
      --line: #c9d3da;
      --ok: #a9dccf;
      --warn: #f2d48f;
      --bad: #f0b3ab;
      --na: #dbe2e7;
      --focus: #1a5fd0;
      --hatch: rgba(15, 31, 44, .28);
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --bg: #0e1a24;
        --surface: #152530;
        --ink: #e5edf3;
        --muted: #93a4b0;
        --line: #28394a;
        --ok: #17554b;
        --warn: #5a4413;
        --bad: #65261f;
        --na: #1b2c38;
        --focus: #7fb0ff;
        --hatch: rgba(229, 237, 243, .30);
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-variant-numeric: tabular-nums
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 16px 64px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 6px
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -.01em
    }

    h2 {
      margin: 36px 0 4px;
      font-size: 1.05rem;
      font-weight: 650
    }

    p {
      margin: 0
    }

    .muted {
      color: var(--muted)
    }

    #conn {
      margin-top: 2px
    }

    #conn.down {
      color: #a3271f;
      font-weight: 600
    }

    @media (prefers-color-scheme:dark) {
      #conn.down {
        color: #ff9d94
      }
    }

    .reset {
      text-align: right
    }

    .reset b {
      display: block;
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.1
    }

    #summary {
      margin: 14px 0 14px
    }

    .scroll {
      overflow-x: auto;
      padding-bottom: 6px
    }

    .grid {
      display: grid;
      grid-template-columns: 8.5rem repeat(var(--n), minmax(5.6rem, 1fr));
      gap: 4px;
      min-width: max-content
    }

    .grid>.h {
      padding: 0 2px 4px;
      color: var(--muted);
      font-size: .85rem;
      align-self: end;
      white-space: nowrap
    }

    .rowlabel {
      padding: 6px 8px 6px 0;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .rowlabel b {
      font-weight: 650
    }

    .rowlabel span {
      color: var(--muted);
      font-size: .85rem
    }

    .tile {
      position: relative;
      overflow: hidden;
      min-height: 62px;
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between
    }

    .tile>* {
      position: relative
    }

    .tile .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0
    }

    .fill.ok {
      background: var(--ok)
    }

    .fill.warn {
      background: var(--warn)
    }

    .fill.bad {
      background: var(--bad)
    }

    .tile .n {
      font-size: 1.15rem;
      font-weight: 650;
      line-height: 1.1
    }

    .tile .n small {
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted)
    }

    .tile .sub {
      font-size: .8rem;
      color: var(--muted);
      min-height: 1.1em
    }

    .tile.cool {
      background-image: repeating-linear-gradient(135deg, var(--warn) 0 7px, transparent 7px 14px)
    }

    .tile.cool .sub {
      color: var(--ink);
      font-weight: 600
    }

    .tile.na,
    .tile.dead {
      background: var(--na);
      color: var(--muted);
      justify-content: center;
      font-size: .9rem
    }

    .tile.dead {
      background-image: repeating-linear-gradient(135deg, var(--bad) 0 7px, transparent 7px 14px);
      color: var(--ink);
      font-weight: 600
    }

    .tile.pass {
      background: var(--ok)
    }

    .tile.limited {
      background: var(--warn)
    }

    .tile.fail {
      background: var(--bad)
    }

    .tile.pass .sub,
    .tile.limited .sub,
    .tile.fail .sub {
      color: var(--ink)
    }

    .flag {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--bad);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 600
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: .85rem
    }

    .legend i {
      display: inline-block;
      width: .8em;
      height: .8em;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px;
      border: 1px solid var(--line)
    }

    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    button:disabled {
      opacity: .55;
      cursor: progress
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px
    }

    #note {
      margin-top: 8px;
      max-width: 64ch;
      font-size: .88rem
    }

    #testsum {
      margin: 16px 0 8px;
      font-weight: 600;
      min-height: 1.4em
    }

    #fails {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      max-width: 80ch
    }

    #fails li {
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: .9rem
    }

    #fails b {
      font-weight: 650
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Gemini router</h1>
        <p id="conn" class="muted" role="status">Connecting…</p>
      </div>
      <div class="reset"><b id="clock">--:--:--</b><span class="muted">until quotas reset (midnight Pacific)</span>
      </div>
    </header>

    <p id="summary" class="muted"></p>
    <div class="scroll">
      <div id="usage"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>used today, room left</span>
      <span><i style="background:var(--warn)"></i>70% or more used</span>
      <span><i style="background:var(--bad)"></i>daily cap reached</span>
      <span><i style="background:repeating-linear-gradient(135deg,var(--warn) 0 3px,transparent 3px 6px)"></i>cooling
        down</span>
      <span><i style="background:var(--na)"></i>model unavailable for that key</span>
    </div>

    <h2>Test every key and model</h2>
    <button id="test" disabled>Test all keys and models</button>
    <p id="note" class="muted"></p>
    <p id="testsum" aria-live="polite"></p>
    <div class="scroll">
      <div id="results"></div>
    </div>
    <ul id="fails"></ul>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const short = m => m.replace(/^gemini-/, '');
    const pad = n => String(n).padStart(2, '0');
    const clock = s => { s = Math.max(0, Math.floor(s)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
    const dur = s => s < 90 ? `${s}s` : s < 5400 ? `${Math.round(s / 60)}m` : `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m`;

    let stats = null, resetAt = 0, testing = false;

    function grid(rows, tile) {
      const head = '<div class="h"></div>' + stats.models.map(m => `<div class="h" title="${esc(m)}">${esc(short(m))}</div>`).join('');
      const body = rows.map(r => `<div class="rowlabel"><b>${esc(r.key)}${r.blacklisted ? '<span class="flag">blacklisted</span>' : ''}</b><span>${esc(r.sub)}</span></div>` +
        stats.models.map(m => tile(r, m)).join('')).join('');
      return `<div class="grid" style="--n:${stats.models.length}">${head}${body}</div>`;
    }

    function usageTile(k, m) {
      const s = k.slots[m], lim = stats.rpd_limit;
      if (k.blacklisted) return `<div class="tile dead" title="This key is blacklisted">blocked</div>`;
      if (s.unsupported) return `<div class="tile na" title="${esc(m)} isn't available on this key">n/a</div>`;
      const pct = Math.min(100, s.used / lim * 100), lvl = pct >= 100 ? 'bad' : pct >= 70 ? 'warn' : 'ok';
      const sub = s.cooldown > 0 ? `wait ${dur(s.cooldown)}` : s.rpm ? `${s.rpm}/${stats.rpm_limit} per min` : '';
      return `<div class="tile${s.cooldown > 0 ? ' cool' : ''}" title="${esc(m)}: ${s.used} of ${lim} used today, ${s.rpm} of ${stats.rpm_limit} this minute">` +
        `<i class="fill ${lvl}" style="height:${pct}%"></i><span class="n">${s.used}<small>/${lim}</small></span><span class="sub">${sub}</span></div>`;
    }

    function render() {
      const keys = stats.keys.map(k => ({ ...k, sub: `${k.successful_requests} ok, ${k.failed_requests} failed` }));
      const used = keys.reduce((a, k) => a + Object.values(k.slots).reduce((b, s) => b + s.used, 0), 0);
      $('#summary').textContent = `${used} requests used today across ${keys.length} ${keys.length === 1 ? 'key' : 'keys'} and ${stats.models.length} models. ` +
        `Each key and model gets ${stats.rpd_limit} per day and ${stats.rpm_limit} per minute.`;
      $('#usage').innerHTML = grid(keys, usageTile);
      const n = keys.length * stats.models.length;
      $('#note').textContent = `Sends ${n} real requests, one per key and model, and counts them against today's quota. ` +
        `A passing test clears that combo's cooldown, unavailable and blacklist flags.`;
      if (!testing) $('#test').disabled = false;
    }

    function setConn(up) {
      const c = $('#conn');
      c.className = up ? 'muted' : 'down';
      c.textContent = up ? 'Live, refreshing every 3 seconds' : 'Router not reachable. Start router.py; this page reconnects on its own.';
    }

    async function refresh() {
      try {
        const r = await fetch('/stats', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        stats = await r.json();
        resetAt = Date.now() / 1000 + stats.seconds_to_midnight_reset;
        setConn(true); render();
      } catch (e) { setConn(false); }
    }

    function showResults(d) {
      const by = {};
      d.results.forEach(r => by[r.key + '|' + r.model] = r);
      const rows = stats.keys.map(k => {
        const mine = d.results.filter(r => r.key === k.key);
        return { key: k.key, sub: `${mine.filter(r => r.status === 'ok').length} of ${mine.length} passed` };
      });
      const tile = (row, m) => {
        const r = by[row.key + '|' + m];
        if (!r) return '<div class="tile na">not run</div>';
        if (r.status === 'ok') return `<div class="tile pass"><span class="n">Pass</span><span class="sub">${r.latency_ms} ms</span></div>`;
        if (r.code === 429) return '<div class="tile limited"><span class="n">Limited</span><span class="sub">429</span></div>';
        return `<div class="tile fail"><span class="n">Failed</span><span class="sub">${esc(r.code || 'no response')}</span></div>`;
      };
      const limited = d.results.filter(r => r.code === 429).length, failed = d.results.length - d.ok - limited;
      $('#testsum').textContent = `${d.ok} of ${d.tested} passed, ${limited} rate limited, ${failed} failed.`;
      $('#results').innerHTML = grid(rows, tile);
      $('#fails').innerHTML = d.results.filter(r => r.status !== 'ok').map(r =>
        `<li><b>${esc(r.key)} on ${esc(short(r.model))}</b> ${esc(r.code || '')} ${esc(r.detail || '')}</li>`).join('');
    }

    async function runTest() {
      const n = stats.keys.length * stats.models.length;
      if (!confirm(`Send ${n} test requests? They count against today's quota.`)) return;
      const btn = $('#test');
      testing = true; btn.disabled = true; btn.textContent = `Testing ${n} combinations…`;
      $('#testsum').textContent = ''; $('#fails').innerHTML = '';
      try {
        const r = await fetch('/test-all', { method: 'POST' });
        if (!r.ok) throw new Error(`router returned ${r.status}`);
        showResults(await r.json());
      } catch (e) {
        $('#testsum').textContent = `Test failed: ${e.message}. Check that router.py is still running.`;
      } finally {
        testing = false; btn.disabled = false; btn.textContent = 'Test all keys and models';
        refresh();
      }
    }

    $('#test').addEventListener('click', runTest);
    setInterval(() => { $('#clock').textContent = clock(resetAt - Date.now() / 1000); }, 1000);
    setInterval(refresh, 3000);
    refresh();
  </script>
</body>

</html>
