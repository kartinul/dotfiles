<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini router</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --ink: #ffffff;
      --muted: #888888;
      --line: #222222;
      --ok: #15803d;
      --warn: #b45309;
      --bad: #b91c1c;
      --na: #1a1a1a;
      --focus: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    p {
      margin: 0;
    }

    .muted {
      color: var(--muted);
    }

    #conn {
      font-size: 0.9rem;
    }

    #conn.down {
      color: #ff9d94;
      font-weight: 600;
    }

    .reset {
      text-align: right;
    }

    .reset b {
      display: block;
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .scroll {
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 8.5rem repeat(var(--n), minmax(5.6rem, 1fr));
      gap: 4px;
      min-width: max-content;
    }

    .grid>.h {
      padding: 0 2px 4px;
      color: var(--muted);
      font-size: .85rem;
      align-self: end;
      white-space: nowrap;
    }

    .rowlabel {
      padding: 6px 8px 6px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .rowlabel b {
      font-weight: 650;
    }

    .rowlabel span {
      color: var(--muted);
      font-size: .85rem;
    }

    .tile {
      position: relative;
      overflow: hidden;
      min-height: 62px;
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tile-content {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .tile .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      transition: height 0.3s ease;
    }

    .fill.ok {
      background: var(--ok);
    }

    .tile .n {
      font-size: 1.15rem;
      font-weight: 650;
      line-height: 1.1;
      color: var(--ink);
      -webkit-text-stroke: 3px var(--surface);
      paint-order: stroke fill;
      text-shadow:
        -1px -1px 0 var(--surface),
        1px -1px 0 var(--surface),
        -1px 1px 0 var(--surface),
        1px 1px 0 var(--surface);
    }

    .tile .n small {
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
    }

    .tile.cool {
      background-image: repeating-linear-gradient(135deg, var(--warn) 0 10px, var(--surface) 10px 20px);
    }

    .tile.cool .fill,
    .tile.limited .fill {
      display: none;
    }

    .tile.na,
    .tile.dead {
      background: var(--na);
      color: var(--muted);
      justify-content: center;
      font-size: .9rem;
    }

    .tile.dead {
      background-image: repeating-linear-gradient(135deg, var(--bad) 0 10px, var(--surface) 10px 20px);
      color: var(--ink);
      font-weight: 600;
    }

    .tile.limited {
      background-image: repeating-linear-gradient(135deg, var(--bad) 0 10px, var(--surface) 10px 20px);
    }

    .flag {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--bad);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 600;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 24px;
      color: var(--muted);
      font-size: .85rem;
    }

    .legend i {
      display: inline-block;
      width: .8em;
      height: .8em;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px;
      border: 1px solid var(--line);
    }

    button {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--surface);
      border-color: var(--muted);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .status-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--muted);
      border-top-color: var(--ink);
      border-radius: 50%;
      display: inline-block;
    }

    @media (prefers-reduced-motion: no-preference) {
      .spinner {
        animation: spin 0.8s linear infinite;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .checkmark {
      width: 14px;
      height: 14px;
      color: #10b981;
      display: inline-block;
    }

    .checkmark__check {
      stroke-dasharray: 20;
      stroke-dashoffset: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .checkmark__check {
        stroke-dashoffset: 20;
        animation: draw 0.3s ease-out forwards;
      }
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .countdown {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      position: absolute;
      right: 9px;
      bottom: 7px;
      z-index: 2;
    }

    .tile.replace-number .n {
      display: none !important;
    }

    .tile.replace-number .status-slot {
      margin-left: 0;
      width: 100%;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Gemini router <span id="limit-pill" class="flag">0 combos at daily limit</span></h1>
        <div class="status-container">
          <p id="conn" class="muted" role="status">Connecting…</p>
          <button id="test" aria-label="Test all keys and models" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
        </div>
      </div>
      <div class="reset">
        <b id="clock">--:--:--</b>
        <span class="muted">until quotas reset (midnight Pacific)</span>
      </div>
    </header>

    <div class="scroll">
      <div id="usage"></div>
    </div>

    <div class="legend">
      <span><i style="background:var(--ok)"></i>used today, room left</span>
      <span><i
          style="background:repeating-linear-gradient(135deg, var(--warn) 0 3px, var(--surface) 3px 6px)"></i>cooling
        down</span>
      <span><i style="background:repeating-linear-gradient(135deg, var(--bad) 0 3px, var(--surface) 3px 6px)"></i>daily
        cap reached</span>
      <span><i style="background:var(--na)"></i>model unavailable for that key</span>
    </div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:9999' : '';
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const short = m => m.replace(/^gemini-/, '');
    const pad = n => String(n).padStart(2, '0');
    const clock = s => { s = Math.max(0, Math.floor(s)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };

    let stats = null, resetAt = 0, testing = false;
    const inFlight = {};
    const resultTimeout = {};

    function getInFlight(key, model) {
      if (!inFlight[key]) inFlight[key] = {};
      if (!inFlight[key][model]) inFlight[key][model] = new Set();
      return inFlight[key][model];
    }

    function grid(rows, tile) {
      const head = '<div class="h"></div>' + stats.models.map(m => `<div class="h">${esc(short(m))}</div>`).join('');
      const body = rows.map(r => {
        const rowId = `row-${r.key}`;
        return `<div class="rowlabel" id="${rowId}">` +
          `<b>${esc(r.key)}${r.blacklisted ? '<span class="flag">blacklisted</span>' : ''}</b>` +
          `<span class="sub-label">${esc(r.sub)}</span>` +
          `</div>` +
          stats.models.map(m => {
            const tileId = `tile-${r.key}-${m}`;
            return `<div class="tile" id="${tileId}"></div>`;
          }).join('');
      }).join('');
      return `<div class="grid" style="--n:${stats.models.length}">${head}${body}</div>`;
    }

    function updateTileState(key, model) {
      const k = stats.keys.find(x => x.key === key);
      if (!k) return;
      const s = k.slots[model];
      if (!s) return;

      const tileEl = document.getElementById(`tile-${key}-${model}`);
      if (!tileEl) return;

      if (k.blacklisted) {
        tileEl.className = 'tile dead';
        tileEl.innerHTML = 'blocked';
        return;
      }
      if (s.unsupported) {
        tileEl.className = 'tile na';
        tileEl.innerHTML = 'n/a';
        return;
      }

      const lim = stats.rpd_limit;
      const pct = Math.min(100, s.used / lim * 100);
      const isLimited = s.used >= lim;

      const nowSec = Date.now() / 1000;
      const isCooling = s.cooldown_ends_at && s.cooldown_ends_at > nowSec;

      tileEl.className = 'tile' + (isCooling ? ' cool' : '') + (isLimited ? ' limited' : '');

      if (!tileEl.querySelector('.tile-content')) {
        tileEl.innerHTML = `<i class="fill" style="height:0%"></i>` +
          `<div class="tile-content">` +
          `<span class="n"></span>` +
          `<span class="status-slot"></span>` +
          `</div>`;
      }

      const fillEl = tileEl.querySelector('.fill');
      if (fillEl) {
        fillEl.style.height = `${pct}%`;
        fillEl.className = 'fill ok';
      }

      const nEl = tileEl.querySelector('.n');
      if (nEl) {
        nEl.innerHTML = `${s.used}<small>/${lim}</small>`;
      }
    }

    function updateHeaderPill() {
      if (!stats) return;
      let count = 0;
      stats.keys.forEach(k => {
        if (!k.blacklisted) {
          Object.values(k.slots).forEach(s => {
            if (!s.unsupported && s.used >= stats.rpd_limit) {
              count++;
            }
          });
        }
      });
      const pill = $('#limit-pill');
      if (pill) {
        pill.textContent = `${count} combo${count === 1 ? '' : 's'} at daily limit`;
        pill.style.background = count > 0 ? 'var(--bad)' : 'var(--na)';
      }
    }

    function initGrid() {
      const keys = stats.keys.map(k => ({ ...k, sub: `${k.successful_requests} ok, ${k.failed_requests} failed` }));
      $('#usage').innerHTML = grid(keys, null);

      stats.keys.forEach(k => {
        Object.keys(k.slots).forEach(m => {
          updateTileState(k.key, m);
        });
      });
      updateHeaderPill();
      if (!testing) $('#test').disabled = false;
    }

    function setConn(up) {
      const c = $('#conn');
      c.className = up ? 'muted' : 'down';
      c.textContent = up ? 'Live' : 'Router not reachable. Start router.py; this page reconnects on its own.';
    }

    function clearTileResult(key, model) {
      const tileEl = document.getElementById(`tile-${key}-${model}`);
      if (!tileEl) return;
      tileEl.classList.remove('replace-number');
      const slotEl = tileEl.querySelector('.status-slot');
      if (slotEl) {
        slotEl.innerHTML = '';
      }
      const infl = getInFlight(key, model);
      if (infl.size > 0) {
        showSpinner(tileEl, slotEl);
      }
    }

    function showSpinner(tileEl, slotEl) {
      slotEl.innerHTML = `<span class="spinner"></span>`;
    }

    function onRequestStarted(id, key, model) {
      const infl = getInFlight(key, model);
      infl.add(id);

      const tileEl = document.getElementById(`tile-${key}-${model}`);
      if (!tileEl) return;

      const slotEl = tileEl.querySelector('.status-slot');
      if (slotEl && infl.size === 1) {
        if (!resultTimeout[`${key}|${model}`]) {
          showSpinner(tileEl, slotEl);
        }
      }
    }

    function onRequestFinished(id, key, model, status, latency, slot) {
      const infl = getInFlight(key, model);
      infl.delete(id);

      if (stats) {
        const k = stats.keys.find(x => x.key === key);
        if (k) {
          k.slots[model] = slot;
        }
      }

      updateTileState(key, model);

      const tileEl = document.getElementById(`tile-${key}-${model}`);
      if (!tileEl) return;

      const slotEl = tileEl.querySelector('.status-slot');
      if (!slotEl) return;

      let resultHTML = '';
      if (status === 200) {
        resultHTML = `<svg class="checkmark" viewBox="0 0 12 12"><path class="checkmark__check" fill="none" stroke="currentColor" stroke-width="2" d="M2 6l3 3 5-6" /></svg>`;
      } else {
        const code = status || 'ERR';
        const isAmber = code === 429;
        const color = isAmber ? 'var(--warn)' : 'var(--bad)';
        resultHTML = `<span style="color:${color}; font-weight:700; font-size:0.85rem;">${code}</span>`;
      }

      slotEl.innerHTML = resultHTML;

      const nEl = tileEl.querySelector('.n');
      if (nEl) {
        const doesNotFit = (nEl.offsetWidth + 20) > tileEl.clientWidth;
        if (doesNotFit) {
          tileEl.classList.add('replace-number');
        }
      }

      const timeoutKey = `${key}|${model}`;
      if (resultTimeout[timeoutKey]) {
        clearTimeout(resultTimeout[timeoutKey]);
      }

      resultTimeout[timeoutKey] = setTimeout(() => {
        delete resultTimeout[timeoutKey];
        clearTileResult(key, model);
      }, 750);
    }

    function onSlotChanged(key, model, slot) {
      if (stats) {
        const k = stats.keys.find(x => x.key === key);
        if (k) {
          k.slots[model] = slot;
        }
      }
      updateTileState(key, model);
      updateHeaderPill();
    }

    function onKeyChanged(key, blacklisted, successful, failed) {
      if (stats) {
        const k = stats.keys.find(x => x.key === key);
        if (k) {
          k.blacklisted = blacklisted;
          k.successful_requests = successful;
          k.failed_requests = failed;
        }
      }
      const rowEl = document.getElementById(`row-${key}`);
      if (rowEl) {
        rowEl.innerHTML = `<b>${esc(key)}${blacklisted ? '<span class="flag">blacklisted</span>' : ''}</b>` +
          `<span class="sub-label">${esc(successful)} ok, ${esc(failed)} failed</span>`;
      }
      if (stats) {
        stats.models.forEach(m => {
          updateTileState(key, m);
        });
      }
      updateHeaderPill();
    }

    let es = null;
    function connectSSE() {
      if (es) es.close();
      es = new EventSource(`${API_BASE}/events`);
      es.onopen = () => {
        setConn(true);
      };
      es.onerror = () => {
        setConn(false);
      };
      es.addEventListener('snapshot', e => {
        stats = JSON.parse(e.data);
        resetAt = stats.reset_at;
        initGrid();
      });
      es.addEventListener('reset', e => {
        // followed by snapshot
      });
      es.addEventListener('request_started', e => {
        const d = JSON.parse(e.data);
        onRequestStarted(d.id, d.key, d.model);
      });
      es.addEventListener('request_finished', e => {
        const d = JSON.parse(e.data);
        onRequestFinished(d.id, d.key, d.model, d.status, d.latency_ms, d.slot);
      });
      es.addEventListener('slot_changed', e => {
        const d = JSON.parse(e.data);
        onSlotChanged(d.key, d.model, d.slot);
      });
      es.addEventListener('key_changed', e => {
        const d = JSON.parse(e.data);
        onKeyChanged(d.key, d.blacklisted, d.successful_requests, d.failed_requests);
      });
    }

    async function runTest() {
      const n = stats.keys.length * stats.models.length;
      if (!confirm(`Send ${n} test requests? They count against today's quota.`)) return;
      const btn = $('#test');
      testing = true; btn.disabled = true;
      try {
        const r = await fetch(`${API_BASE}/test-all`, { method: 'POST' });
        if (!r.ok) throw new Error(`router returned ${r.status}`);
      } catch (e) {
        alert(`Test failed: ${e.message}`);
      } finally {
        testing = false; btn.disabled = false;
      }
    }

    $('#test').addEventListener('click', runTest);

    // Live ticking countdown for cooling down slots
    setInterval(() => {
      if (!stats) return;
      const nowSec = Date.now() / 1000;
      stats.keys.forEach(k => {
        Object.keys(k.slots).forEach(m => {
          const s = k.slots[m];
          const tileEl = document.getElementById(`tile-${k.key}-${m}`);
          if (!tileEl) return;

          const isCooling = s.cooldown_ends_at && s.cooldown_ends_at > nowSec;
          if (isCooling) {
            const remaining = Math.max(0, Math.ceil(s.cooldown_ends_at - nowSec));
            let cdEl = tileEl.querySelector('.countdown');
            if (!cdEl) {
              cdEl = document.createElement('span');
              cdEl.className = 'countdown';
              tileEl.appendChild(cdEl);
            }
            cdEl.textContent = `${remaining}s`;
            if (!tileEl.classList.contains('cool')) {
              tileEl.classList.add('cool');
            }
          } else {
            const cdEl = tileEl.querySelector('.countdown');
            if (cdEl) cdEl.remove();
            if (tileEl.classList.contains('cool')) {
              tileEl.classList.remove('cool');
            }
          }
        });
      });
    }, 1000);

    // Live ticking reset clock
    setInterval(() => {
      if (resetAt) {
        $('#clock').textContent = clock(resetAt - Date.now() / 1000);
      }
    }, 1000);

    connectSSE();
  </script>
</body>

</html>
