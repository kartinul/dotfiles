[package]
name = "xvpn"
version = "0.1.0"
edition = "2021"

[lib]
name = "xvpn"
path = "src/lib.rs"

[[bin]]
name = "xvpn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Graceful shutdown: without this, SIGTERM from launchd/systemd kills the
# supervisor instantly and orphans the running proxies.
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true